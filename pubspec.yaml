name: smart_light_monitoring
description: "Smart Light Monitor — real-time ambient light monitoring with Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.7.0
  firebase_database: ^12.3.0
  firebase_messaging: ^16.2.0

  # Sensor
  light_sensor: ^3.0.2

  # Background service
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1

  # State management
  provider: ^6.1.5+1

  # Permissions
  permission_handler: ^12.0.1

  # Device ID
  android_id: ^0.5.1

  # Local storage
  shared_preferences: ^2.5.5

  # HTTP (for nudge FCM endpoint)
  http: ^1.6.0

  # Typography
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
